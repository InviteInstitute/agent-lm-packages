# Scenario 3: piece behind the spawn heading — requires full search behavior.
scenario_id: piece_behind
description: One piece behind the robot at spawn.
goal: clear_debris_zone
testcase_physics: {push_model: kinematic, loop_unroll: 60}
pieces:
  test_piece: {relative: {ahead_mm: 600, bearing_deg: 180}, body_radius_mm: 55}
checks:
  - {name: detects,      rule: behavioral_divergence, divergence_mm: 100, facet: object_detection}
  - {name: navigates_to, rule: min_distance, requires: detects, within_mm: 180, facet: object_pursuit,
     progress_annotation: could_reach_if_run}
  - {name: pushes_off,   rule: pieces_cleared, requires: detects, count: 1, facet: push_execution,
     progress_annotation: could_clear_if_run}
