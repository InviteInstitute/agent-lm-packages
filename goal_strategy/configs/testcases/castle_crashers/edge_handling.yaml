# Scenario 5 (reviewer: separate boundary-sensitivity test, broader than the
# eye): piece near the west edge — a short push clears it. Does the code
# handle the fall-off condition and keep the ROBOT on the island? The stop
# cue differs by strategy: down-eye red (sim-evidenced already), or the
# bumper releasing / eye losing the object when the piece falls — the cases
# only this harness can evidence.
scenario_id: edge_handling
description: Piece near the edge; clearing it must not take the robot off too.
goal: clear_debris_zone
testcase_physics: {push_model: kinematic, loop_unroll: 60}
pieces:
  test_piece: {x: -1500, y: 49, body_radius_mm: 55}
checks:
  - {name: detects,         rule: behavioral_divergence, divergence_mm: 100, facet: object_detection}
  - {name: pushes_off,      rule: pieces_cleared, requires: detects, count: 1, facet: push_execution,
     progress_annotation: could_clear_if_run}
  - {name: stays_on_island, rule: on_island, facet: edge_failure_handling}
