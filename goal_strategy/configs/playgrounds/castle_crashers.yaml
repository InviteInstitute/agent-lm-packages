# --- vex_goal_profiles addition (task spec §5): the only edit relative to the
# --- VEX_model_tracing source card. Block types are named here and only here —
# --- never in Python. Lists match the vendored blocks.csv classification.
# --- vex_goal_profiles addition (reviewer decision 2026-08-18): sessions whose
# --- playground_params lack this field were run on a DIFFERENT playground —
# --- their params (and GPS) were never produced by this code. Corpus loaders
# --- exclude them from the testing set. Overrides task-1 §13 "do not drop".
corpus_filter:
  required_outcome_field: weight_cleared
  # Positive router (Stage 0, 2026-08-21): the run dataset carries the
  # playgroundData blob's self-ID — the platform's LITERAL misspelling,
  # match exactly. Preferred over field-presence when available;
  # required_outcome_field remains the fallback for session-level corpora.
  playground_self_id: CasteCrasherPlus

block_families:
  magnet: [pg_magnet_set_magnet_state]
  movement: [pg_drivetrain_drive, pg_drivetrain_drive_for, pg_drivetrain_turn,
             pg_drivetrain_turn_for, pg_drivetrain_turn_to_heading, pg_drivetrain_turn_to_rotation]
  drive: [pg_drivetrain_drive, pg_drivetrain_drive_for]
  turn: [pg_drivetrain_turn, pg_drivetrain_turn_for, pg_drivetrain_turn_to_heading,
         pg_drivetrain_turn_to_rotation]
