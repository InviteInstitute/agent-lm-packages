      apothem_mm: 984                  # M (center to wall midpoint)
      wall_thickness_mm: 93            # M (estimated)
      corner_posts_mm:                 # M
        bottom:       [-478.2, -1208.4]
        bottom_left:  [-1461.8,  -640.5]
        top_left:     [-1461.8,   495.3]
        top:          [-478.2,  1063.2]
        top_right:    [505.5,   495.3]
        bottom_right: [505.5,  -640.5]
    # Inner castle: axis-aligned square moat + core
    inner_castle:
      center_mm: [-581.5, -80.1]       # M
      moat:
        outer_bbox_mm:
          tl: [-817.3,  155.7]         # M (top-left corner)
          br: [-345.8, -315.8]         # M (bottom-right corner)
        thickness_mm:
